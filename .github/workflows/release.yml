name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag vs Cargo.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=${tag_version} cargo=${cargo_version}"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Package tarball
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          tarball="zcc-${version}-${TARGET}.tar.gz"
          tar czf "${tarball}" -C "target/${TARGET}/release" zcc
          shasum -a 256 "${tarball}" > "${tarball}.sha256"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          cat "${tarball}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  bump-tap:
    name: Bump Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Custom replacement for dawidd6/action-homebrew-bump-formula. That action
      # wraps `brew bump-formula-pr`, which doesn't reliably handle a multi-arch
      # formula (separate `on_arm`/`on_intel` blocks with two URL+sha256 pairs):
      # with `#{version}` interpolation in URLs, its inreplace can't find the
      # literal old URL; with literal URLs, it gets confused about which block
      # carries the canonical version. We sidestep both problems by regenerating
      # the entire formula from the just-published release artifacts.
      #
      # All untrusted inputs (only github.ref_name here) flow through env vars
      # and are quoted in shell — never interpolated directly into the script.
      - name: Open PR against noah-hrbth/homebrew-zcc
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          repo_owner="noah-hrbth"
          repo_name="zed-claude-code"
          tap_repo="${repo_owner}/homebrew-zcc"

          arm_url="https://github.com/${repo_owner}/${repo_name}/releases/download/${REF_NAME}/zcc-${version}-aarch64-apple-darwin.tar.gz"
          intel_url="https://github.com/${repo_owner}/${repo_name}/releases/download/${REF_NAME}/zcc-${version}-x86_64-apple-darwin.tar.gz"

          arm_sha=$(curl -fsSL "${arm_url}" | sha256sum | cut -d' ' -f1)
          intel_sha=$(curl -fsSL "${intel_url}" | sha256sum | cut -d' ' -f1)
          echo "arm_sha=${arm_sha}"
          echo "intel_sha=${intel_sha}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${tap_repo}.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="bump-zcc-${version}"
          git checkout -b "${branch}"

          cat > Formula/zcc.rb <<EOF
          class Zcc < Formula
            desc "Zed <-> Claude Code integration: send editor selection to Claude Code via /ide"
            homepage "https://github.com/${repo_owner}/${repo_name}"
            version "${version}"
            license "MIT"

            on_arm do
              url "${arm_url}"
              sha256 "${arm_sha}"
            end

            on_intel do
              url "${intel_url}"
              sha256 "${intel_sha}"
            end

            def install
              bin.install "zcc"
            end

            def caveats
              <<~EOS
                To finish setup, run:
                  zcc install

                That merges an entry into your Zed tasks.json and keymap.json
                so Cmd+L sends the editor selection to Claude Code.

                Originals are backed up alongside each file as *.bak.
              EOS
            end

            test do
              assert_match "zcc #{version}", shell_output("#{bin}/zcc version")
              assert_match "Send the current editor selection", shell_output("#{bin}/zcc send --help")
              assert_match "zcc doctor", shell_output("#{bin}/zcc doctor")
            end
          end
          EOF

          git add Formula/zcc.rb
          git commit -m "zcc ${version}"
          git push -u origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "zcc ${version}" \
            --body "Automated bump from ${REF_NAME} release."
          gh pr merge "${branch}" --auto --squash --delete-branch
